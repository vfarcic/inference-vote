# Every inference cluster's collector ships the fleet's metrics to Datadog.
# The API key comes from the datadog Secret the setup creates in
# modelplane-system; Modelplane copies it to each cluster.
#
# The demo org is shared, so everything is tagged env:cyoa-kubecon-na-26: filter
# dashboards and monitors on it, and delete by it after the talk.
#
# Modelplane says which deployment, replica and engine a series comes from in
# resource attributes, which the exporter drops unless told to make them tags.
apiVersion: modelplane.ai/v1alpha1
kind: TelemetryDestination
metadata:
  name: datadog
spec:
  sinks:
  - name: datadog
    type: datadog
    secretRef:
      name: datadog
    config:
      api:
        key: ${env:DD_API_KEY}
        site: ${env:DD_SITE}
      metrics:
        resource_attributes_as_tags: true
      host_metadata:
        tags:
        - env:cyoa-kubecon-na-26
