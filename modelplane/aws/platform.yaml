# AWS: one g6.12xlarge, four NVIDIA L4s. Two for the optimized deployment and
# two for the audience's, all in one machine, so either answer to question 2
# (one engine across two cards, or one copy per card) fits.
#
# A g6.12xlarge is 48 vCPUs. New accounts usually have a lower G-instance vCPU
# quota than that, so request an increase well before the talk.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceClass
metadata:
  name: eks-l4-4x-g6
spec:
  description: "EKS g6.12xlarge, 4x NVIDIA L4"
  provisioning:
    provider: EKS
    eks:
      instanceType: g6.12xlarge
      diskSizeGb: 200
      accelerator:
        type: nvidia-l4
        count: 4
  devices:
  - name: gpu
    claim: DRA
    driver: gpu.nvidia.com
    deviceClassName: gpu.nvidia.com
    count: 4
    attributes:
      architecture: { string: Ada Lovelace }
    capacity:
      memory: { value: "23034Mi" }
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: vote
  labels:
    modelplane.ai/region: us-east
spec:
  cluster:
    source: EKS
    eks:
      region: us-east-1
  nodePools:
  - name: gpu-l4
    className: eks-l4-4x-g6
    nodeCount: 1
    minNodeCount: 1
    maxNodeCount: 1
    zones:
    - us-east-1b
