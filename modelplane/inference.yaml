# What both clouds share: the gateway the audience and the load test call,
# the two models they can name, and where the metrics go.
#
# The optimized ModelDeployment is not in here. The setup renders it with
# `inference-vote render`, the same code the bridge uses for the audience's, so
# the two can only ever differ in the three answers.
apiVersion: v1
kind: Namespace
metadata:
  name: ml-team
---
# One gateway, on the same cluster that serves. Callers authenticate with the
# keys in the inference-vote-keys Secret, which the setup generates: one for the
# audience's chat and one for the load test, so Datadog can tell them apart.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceGateway
metadata:
  name: public
spec:
  clusterName: vote
  auth:
    method: APIKey
    apiKey:
      secretSelector:
        matchLabels:
          inference-vote/keys: "true"
---
# Callers name these as ml-team/optimized and ml-team/audience.
#
# idle bounds how long the gateway waits for a streamed answer's first token
# before it abandons the attempt and runs the request again. The 60-second
# default is too short for 100 agents against a full-precision deployment,
# which queues them for longer than that, and every abandoned attempt adds
# load and counts toward shutting the deployment out of the gateway. 180
# seconds matches how long the load test waits before it gives up itself.
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: optimized
  namespace: ml-team
spec:
  timeouts:
    idle: 180s
    request: 300s
  endpoints:
  - name: optimized
    selector:
      matchLabels:
        modelplane.ai/deployment: optimized
---
apiVersion: modelplane.ai/v1alpha1
kind: ModelService
metadata:
  name: audience
  namespace: ml-team
spec:
  timeouts:
    idle: 180s
    request: 300s
  endpoints:
  - name: audience
    selector:
      matchLabels:
        modelplane.ai/deployment: audience
