# The voting app, on the inference cluster Modelplane created. It is the only
# thing in the demo the internet can reach directly: phones open it from the QR
# code, and the bridge on the presenter's laptop polls it.
#
# The setup fills in the image tag and creates the inference-vote Secret
# (presenter and bridge tokens, gateway URL and keys, domain).
apiVersion: v1
kind: Namespace
metadata:
  name: inference-vote
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-vote
  namespace: inference-vote
---
# Read-only, and only pods: enough to show the audience's engines coming up,
# and their logs, to say why one crashed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-vote
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-vote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inference-vote
subjects:
- kind: ServiceAccount
  name: inference-vote
  namespace: inference-vote
---
# Its Let's Encrypt certificates, kept in a Secret so a restart reuses them.
# Create can't be limited to a name, so it is limited to this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-vote-certs
  namespace: inference-vote
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["inference-vote-certs", "inference-vote-certs-staging"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-vote-certs
  namespace: inference-vote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-vote-certs
subjects:
- kind: ServiceAccount
  name: inference-vote
  namespace: inference-vote
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-vote
  namespace: inference-vote
spec:
  # One replica: votes live in memory.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: inference-vote
  template:
    metadata:
      labels:
        app: inference-vote
    spec:
      serviceAccountName: inference-vote
      containers:
      - name: app
        image: ghcr.io/vfarcic/inference-vote:latest
        args: [serve]
        envFrom:
        - secretRef:
            name: inference-vote
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        readinessProbe:
          tcpSocket:
            port: https
        volumeMounts:
        - name: certs
          mountPath: /tmp/certs
        securityContext:
          # Binding 80 and 443 directly, so no ingress controller sits in the way.
          capabilities:
            add: [NET_BIND_SERVICE]
      volumes:
      - name: certs
        emptyDir: {}
---
# A LoadBalancer straight to the app: it terminates TLS itself with a Let's
# Encrypt certificate, so there is no ingress controller or cert-manager to
# install and wait for.
apiVersion: v1
kind: Service
metadata:
  name: inference-vote
  namespace: inference-vote
  annotations:
    # On AWS, a Network Load Balancer: its IP per zone never changes, so
    # <IP>.nip.io keeps working. A Classic one's IPs change under it. Other
    # clouds ignore this.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: inference-vote
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: https
    port: 443
    targetPort: https
